---
app_user: sensors-app
app_group: sensors-app
app_base_dir: /srv/sensors-app
app_python_version: "3.14"

ufw_extra_ports:
  - port: 3000
    proto: tcp # Grafana
  - port: "32768:60999"
    proto: udp
    # Kasa's discovery client binds an OS-assigned ephemeral local UDP
    # port (not a fixed port) and broadcasts to 10.0.0.255:9999/:20002;
    # each device replies as a *unicast* packet back to that ephemeral
    # port. Conntrack doesn't reliably associate that reply with the
    # original broadcast (the reply's source IP is the device's own
    # address, not the broadcast address the query was sent to), so
    # ufw's default deny-incoming was blocking every reply outright --
    # confirmed by `ufw disable` fixing discovery immediately. This is
    # the standard Linux ephemeral port range (`cat
    # /proc/sys/net/ipv4/ip_local_port_range` on rpi4-app to confirm --
    # adjust if it differs).

# Through nginx on rpi4-api, not uvicorn directly.
api_base_url: "http://10.0.0.13/v1"

grafana_apt_key_url: https://apt.grafana.com/gpg.key
grafana_apt_signing_key_path: /usr/share/keyrings/grafana-archive-keyring.asc

# Grafana's own [smtp] section for alert-notification emails. Uses the same
# shared Gmail app-password account as the five apps' --sendemail modes
# (vault_smtp_user / vault_smtp_password) -- no dedicated Grafana secret.
grafana_smtp_host: "smtp.gmail.com:587"
grafana_smtp_from_name: "Grafana"
grafana_smtp_starttls_policy: "MandatoryStartTLS"

rtl433_repo: https://github.com/merbanan/rtl_433.git
rtl433_install_prefix: /usr/local
# Every Acurite-labeled protocol from `rtl_433 -R help` on the actual
# built binary (confirmed via the ansible run's own output) -- rtl_433
# has consolidated what's commonly sold as "Acurite Tower" and "Atlas"
# sensors into a handful of IDs rather than one each per name, so this
# covers the whole family rather than guessing which single ID matches
# the exact hardware on hand.
rtl433_protocols: [10, 11, 40, 41, 55, 74, 163, 197, 326]

# Timer-based apps: each gets its own clone + venv + .env + systemd
# timer/oneshot-service. `env` becomes that app's .env file verbatim
# (plus api_base_url, added automatically) -- vaulted secrets are
# referenced here via Jinja, not hardcoded.
sensor_apps:
  - name: emporia
    repo: https://github.com/jameslittle3369/LilLittleEmporiaEnergy.git
    entrypoint: Emporia_Energy.py
    interval: 2min
    env:
      EMPORIA_USERNAME: "{{ vault_emporia_username }}"
      EMPORIA_PASSWORD: "{{ vault_emporia_password }}"
      EMPORIA_TOKEN_FILE: emporia_tokens.json
      TIMEZONE: "{{ sensors_timezone }}"
      # Only used by manual/cron --sendemail runs -- --push-api ignores these.
      SMTP_USER: "{{ vault_smtp_user }}"
      SMTP_APP_PASSWORD: "{{ vault_smtp_password }}"
      EMAIL_FROM: "{{ vault_smtp_user }}"
      EMAIL_TO: "{{ sensors_email_to }}"

  - name: kasa
    repo: https://github.com/jameslittle3369/LilLittleKasaEnergy.git
    entrypoint: kasa_energy.py
    interval: 2min
    env:
      KASA_DISCOVERY_TARGET: "{{ kasa_discovery_target }}"
      KASA_DISCOVERY_TIMEOUT: 5
      # Newer-firmware Kasa devices require TP-Link cloud auth to discover;
      # blank in vault.yml is fine if all your devices are older/local-only.
      KASA_USERNAME: "{{ vault_kasa_username }}"
      KASA_PASSWORD: "{{ vault_kasa_password }}"
      # Only used by manual/cron --sendemail runs -- --push-api ignores these.
      # Unlike the other three apps, kasa_energy.py has no SMTP_SERVER
      # default, so this one is required for --sendemail to even start.
      SMTP_SERVER: smtp.gmail.com
      SENDER_EMAIL: "{{ vault_smtp_user }}"
      APP_PASSWORD: "{{ vault_smtp_password }}"
      RECEIVER_EMAIL: "{{ sensors_email_to }}"

  - name: ikea
    repo: https://github.com/jameslittle3369/LilLittleIkeaEnergy.git
    entrypoint: ikea_energy.py
    interval: 5min
    env:
      TRADFRI_HOST: "{{ ikea_gateway_host }}"
      TRADFRI_IDENTITY: sensors-app
      TRADFRI_PSK: "{{ vault_tradfri_psk }}"
      TRADFRI_TRANSPORT: auto
      # Only used by manual/cron --sendemail runs -- --push-api ignores these.
      SMTP_USERNAME: "{{ vault_smtp_user }}"
      SMTP_PASSWORD: "{{ vault_smtp_password }}"
      EMAIL_FROM: "{{ vault_smtp_user }}"
      EMAIL_TO: "{{ sensors_email_to }}"

  - name: ring
    repo: https://github.com/jameslittle3369/LilLittleRingEnergy.git
    entrypoint: Ring_Energy.py
    interval: 5min
    env:
      RING_USER_AGENT: sensors-app-ring-1.0
      RING_TOKEN_CACHE: .ring_token.cache
      RING_TIMEOUT: "30"
      # Only used by manual/cron --sendemail runs -- --push-api ignores these.
      GMAIL_USER: "{{ vault_smtp_user }}"
      GMAIL_APP_PASSWORD: "{{ vault_smtp_password }}"
      EMAIL_FROM: "{{ vault_smtp_user }}"
      EMAIL_TO: "{{ sensors_email_to }}"

  - name: honeywell
    repo: https://github.com/jameslittle3369/LilLittleHoneywellHVAC.git
    entrypoint: honeywell_hvac.py
    # mytotalconnectcomfort.com rate-limits frequent logins, and this
    # script logs in fresh every run -- conservative interval vs. the
    # 2-5min used for the LAN-only apps.
    interval: 15min
    env:
      HONEYWELL_USERNAME: "{{ vault_honeywell_username }}"
      HONEYWELL_PASSWORD: "{{ vault_honeywell_password }}"
      # Only used by manual/cron --sendemail runs -- --push-api ignores these.
      SMTP_USERNAME: "{{ vault_smtp_user }}"
      SMTP_PASSWORD: "{{ vault_smtp_password }}"
      EMAIL_FROM: "{{ vault_smtp_user }}"
      EMAIL_TO: "{{ sensors_email_to }}"

  - name: balboa-spa
    repo: https://github.com/jameslittle3369/lillittle-balboa-spa.git
    entrypoint: balboa_spa.py
    # Local network only (no cloud account) -- same rationale as kasa/
    # emporia's 2min interval, no rate-limit concern.
    interval: 2min
    env:
      SPA_HOST: "{{ spa_host }}"
      SPA_PORT: 4257
      SPA_NAME: Spa
      # Only used by manual/cron --sendemail runs -- --push-api ignores these.
      SMTP_SERVER: smtp.gmail.com
      SENDER_EMAIL: "{{ vault_smtp_user }}"
      APP_PASSWORD: "{{ vault_smtp_password }}"
      RECEIVER_EMAIL: "{{ sensors_email_to }}"

  - name: astronomy
    repo: https://github.com/jameslittle3369/lillittle-astronomy.git
    entrypoint: astronomy.py
    # Once a day is plenty -- these values don't change intraday. Unlike
    # every other app here, `on_calendar` fires at a fixed time of day
    # instead of drifting on a monotonic interval -- app.timer.j2
    # branches on whether this key is defined, and `interval` is simply
    # not read in that branch, so it's omitted here rather than set to
    # an unused placeholder.
    on_calendar: "*-*-* 00:10:00"
    env:
      IPGEOLOCATION_API_KEY: "{{ vault_ipgeolocation_api_key }}"
      LATITUDE: "{{ astronomy_latitude }}"
      LONGITUDE: "{{ astronomy_longitude }}"
      ELEVATION_M: "{{ astronomy_elevation_m }}"
      TIMEZONE: "{{ sensors_timezone }}"
      SITE_NAME: "{{ astronomy_site_name }}"
      # Only used by manual/cron --sendemail runs -- --push-api ignores these.
      SMTP_USERNAME: "{{ vault_smtp_user }}"
      SMTP_PASSWORD: "{{ vault_smtp_password }}"
      EMAIL_FROM: "{{ vault_smtp_user }}"
      EMAIL_TO: "{{ sensors_email_to }}"

# TODO: update once the rtl-postgres repo is created and pushed.
rtl_postgres_repo: https://github.com/jameslittle3369/LilLittleRTL_433.git
rtl_postgres_env:
  EXCLUDE_SENSOR_IDS: ""

# TODO: update once you've created the GitHub repo for sensors-apps/alarm
# and decided on its name/pushed it -- this placeholder will fail the
# `git clone` task until then.
alarm_repo: https://github.com/jameslittle3369/lillittle-alarm.git
envisalink_host: "10.0.0.30"
envisalink_port: 4025

# DSC doesn't expose zone/partition names or types over the EnvisaLink TPI
# protocol, only numbers -- these map your real zone/partition numbers to
# friendly names (and, for zones, a type: door/window/motion/smoke/heat/
# other) read by envisalink_2_postgres.py. Not secret, just your house's
# layout -- fill in your real zone numbers here.
alarm_zone_map:
  "1": { name: "Front Door", type: "door" }
alarm_partition_map:
  "1": "Main"

# TODO: your Pi's actual local timezone, TRADFRI gateway IP, Kasa LAN
# broadcast address, and spa IP -- filling in generic placeholders for now.
# (sensors_timezone itself now lives in group_vars/all/vars.yml -- the api
# role needs it too, for the almanac endpoints -- but every reference
# below still just reads {{ sensors_timezone }} unchanged.)
ikea_gateway_host: "10.0.0.15"
kasa_discovery_target: "10.0.0.255"
# Use a router DHCP reservation, not a bare lease -- a moved IP silently
# breaks polling until someone notices (same caution as ikea_gateway_host).
spa_host: "10.0.0.35"

# Recipient for all four apps' manual/cron --sendemail reports (the sender
# is the shared vault_smtp_user account itself). Not a secret -- just your
# inbox address.
sensors_email_to: "james.a.little@hotmail.com"
