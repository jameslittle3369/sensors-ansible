---
api_repo_url: https://github.com/jameslittle3369/sensors-backend-fastapi.git
api_repo_version: main
api_app_user: sensors-api
api_app_group: sensors-api
api_app_dir: /srv/sensors-api/app
api_env_file: /etc/sensors-api/api.env
api_python_version: "3.14"
api_uvicorn_port: 8000
api_owserver_url: "http://10.0.0.188/details.xml"
api_dyson_host: "10.0.0.17"

# Almanac / house-compass panel. astronomy_latitude/longitude/elevation_m/
# site_name and sensors_timezone live in group_vars/all/vars.yml -- the
# astronomy app (group_vars/app) needs the exact same values, so they're
# shared rather than duplicated. Only the compass geometry and the house
# photo itself are api-role-only.
#
# House photo: roles/api/files/MiCasa.jpg (confirmed north-up) -- resized
# from the original 2600x1600/7.5MB PNG to 1600x984 and converted to JPEG
# (quality 85) so compass.svg's embedded data: URI stays a reasonable
# size for a panel that refreshes every minute; the untouched original is
# kept alongside it as MiCasa-original.png. Geometry below tuned by
# actually rendering compass.svg against this exact photo (both a
# same-day view and a December-solstice "not today" view) and eyeballing
# it in a browser -- the ring sits centred on the house without
# overrunning into the neighbouring lot at #130. Re-tune the same way
# (render standalone, no Grafana needed -- see
# sensors-apps/astronomy/README.md) if the photo is ever replaced.
api_house_image_local_path: "roles/api/files/MiCasa.jpg"
api_house_image_remote_path: "/etc/sensors-api/house.jpg"
api_compass_north_offset_deg: "0"
api_compass_center_x_pct: "0.48"
api_compass_center_y_pct: "0.475"
api_compass_radius_pct: "0.30"

ufw_extra_ports:
  - port: 80
    proto: tcp
