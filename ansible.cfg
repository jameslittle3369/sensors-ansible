[defaults]
inventory      = inventory/hosts.yml
roles_path     = roles
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent

[privilege_escalation]
become = False
# Intentionally no global become_method/become_user here.
# "become" is opted into per-task only inside roles/postgres,
# where become_method=su / become_user=postgres is required
# (see roles/postgres/tasks/roles_db.yml). Everything else runs
# as root directly over SSH -- no sudo, ever.

[ssh_connection]
pipelining = True
