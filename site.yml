---
- name: Apply common baseline to all managed hosts
  hosts: all
  gather_facts: true
  roles:
    - common

- name: Configure PostgreSQL on rpi4-db
  hosts: db
  gather_facts: true
  roles:
    - postgres

- name: Configure rpi4-api
  hosts: api
  gather_facts: true
  roles:
    - api

- name: Configure rpi4-app
  hosts: app
  gather_facts: true
  roles:
    - app
