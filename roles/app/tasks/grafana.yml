---
# Grafana is already manually installed and working on rpi4-app (dashboards
# backed up as JSON). This task set only ensures it's installed/running --
# it deliberately checks first and skips the repo/package install entirely
# if grafana-server is already present, rather than risking an apt-triggered
# upgrade/reinstall disturbing what's already there.

- name: Check whether grafana-server is already installed
  ansible.builtin.command: dpkg-query -W -f='${Status}' grafana
  register: grafana_dpkg_status
  changed_when: false
  failed_when: false

- name: Set fact for whether Grafana needs installing
  ansible.builtin.set_fact:
    grafana_needs_install: "{{ 'install ok installed' not in grafana_dpkg_status.stdout }}"

- name: Install prerequisites for repo management
  ansible.builtin.apt:
    name: [ca-certificates, curl, gnupg]
    state: present
    update_cache: true
  when: grafana_needs_install

- name: Ensure keyring directory exists
  ansible.builtin.file:
    path: /usr/share/keyrings
    state: directory
    mode: '0755'
  when: grafana_needs_install

- name: Download Grafana signing key
  ansible.builtin.get_url:
    url: "{{ grafana_apt_key_url }}"
    dest: "{{ grafana_apt_signing_key_path }}"
    mode: '0644'
  when: grafana_needs_install

- name: Add Grafana apt repository (deb822 sources format)
  ansible.builtin.deb822_repository:
    name: grafana
    types: deb
    uris: https://apt.grafana.com
    suites: stable
    components: main
    signed_by: "{{ grafana_apt_signing_key_path }}"
    state: present
  register: grafana_repo
  when: grafana_needs_install

- name: Refresh apt cache after adding Grafana repo
  ansible.builtin.apt:
    update_cache: true
  when: grafana_needs_install and grafana_repo is changed

- name: Install Grafana
  ansible.builtin.apt:
    name: grafana
    state: present
  when: grafana_needs_install

- name: Ensure Grafana is enabled and running
  ansible.builtin.systemd:
    name: grafana-server
    enabled: true
    state: started

# Ansible now owns this [smtp] section -- any manual edits to it in
# /etc/grafana/grafana.ini will be overwritten on the next playbook run.
- name: Configure Grafana SMTP settings (non-secret keys)
  community.general.ini_file:
    path: /etc/grafana/grafana.ini
    section: smtp
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    create: false
    backup: true
  loop:
    - { option: enabled, value: "true" }
    - { option: host, value: "{{ grafana_smtp_host }}" }
    - { option: user, value: "{{ vault_smtp_user }}" }
    - { option: from_address, value: "{{ vault_smtp_user }}" }
    - { option: from_name, value: "{{ grafana_smtp_from_name }}" }
    - { option: startTLS_policy, value: "{{ grafana_smtp_starttls_policy }}" }
  loop_control:
    label: "{{ item.option }}"
  notify: restart grafana-server

- name: Configure Grafana SMTP password (vaulted secret)
  community.general.ini_file:
    path: /etc/grafana/grafana.ini
    section: smtp
    option: password
    value: "{{ vault_smtp_password }}"
    create: false
    backup: true
  no_log: true
  notify: restart grafana-server
