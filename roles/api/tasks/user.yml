---
- name: Ensure sensors-api group exists
  ansible.builtin.group:
    name: "{{ api_app_group }}"
    system: true
    state: present

- name: Ensure sensors-api system user exists
  ansible.builtin.user:
    name: "{{ api_app_user }}"
    group: "{{ api_app_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: /srv/sensors-api
    create_home: true
    state: present

- name: Ensure the app directory exists
  ansible.builtin.file:
    path: "{{ api_app_dir }}"
    state: directory
    owner: "{{ api_app_user }}"
    group: "{{ api_app_group }}"
    mode: '0755'
