---
- name: Install prerequisites for the uv installer
  ansible.builtin.apt:
    name: [ca-certificates, curl]
    state: present
    update_cache: true

- name: Install uv system-wide
  ansible.builtin.shell: |
    set -o pipefail
    curl -LsSf https://astral.sh/uv/install.sh | sh
  args:
    creates: /usr/local/bin/uv
    executable: /bin/bash
  environment:
    UV_INSTALL_DIR: /usr/local/bin

# The install task above is `creates:`-guarded and only ever runs once --
# on an already-provisioned host, uv itself never gets updated by this
# playbook. uv vendors its own TLS root bundle (not the OS/certifi one),
# so it needed its own fix for the 2026-10 emSign CA security advisory;
# `uv self update` is a safe no-op when already current, so it's left
# here unconditionally rather than one-off-patched and removed.
- name: Update uv to the latest release (idempotent self-update)
  ansible.builtin.command: /usr/local/bin/uv self update
  register: uv_self_update
  changed_when: "'Upgraded uv' in uv_self_update.stdout"

# No separate "uv python install" step here: `uv sync` in app.yml runs as
# api_app_user and provisions the pinned Python version (from pyproject's
# requires-python) into that user's own uv data dir on demand. Running
# `uv python install` as root here would install into root's uv data dir
# instead, which api_app_user can't use -- pointless and misleading.
