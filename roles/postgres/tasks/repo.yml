---
- name: Install prerequisites for repo management
  ansible.builtin.apt:
    name: [ca-certificates, curl, gnupg, python3-debian]
    state: present
    update_cache: true

- name: Ensure PGDG keyring directory exists
  ansible.builtin.file:
    path: /usr/share/postgresql-common/pgdg
    state: directory
    mode: '0755'

- name: Download PGDG signing key
  ansible.builtin.get_url:
    url: "{{ postgres_pgdg_key_url }}"
    dest: "{{ postgres_pgdg_key_path }}"
    mode: '0644'

- name: Add PGDG apt repository (deb822 sources format)
  ansible.builtin.deb822_repository:
    name: pgdg
    types: deb
    uris: https://apt.postgresql.org/pub/repos/apt
    suites: "{{ ansible_distribution_release }}-pgdg"
    components: main
    architectures: "{{ postgres_pgdg_apt_architecture }}"
    signed_by: "{{ postgres_pgdg_key_path }}"
    state: present
  register: pgdg_repo

- name: Refresh apt cache after adding PGDG repo
  ansible.builtin.apt:
    update_cache: true
  when: pgdg_repo is changed
